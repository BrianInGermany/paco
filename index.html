<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACO Y PACO | Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f2e9d9;
            color: #1a1a1a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            padding: 20px;
            margin-bottom: 100px; /* Platz für den Footer */
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            margin: 0;
            color: #b22222;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .line {
            width: 100px;
            height: 4px;
            background-color: #1a1a1a;
            margin: 20px auto;
        }

        .keywords {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            color: #1e4d2b;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .coming-soon {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #333;
            letter-spacing: 2px;
            font-weight: 300;
            font-style: italic;
            animation: pulse 2s infinite ease-in-out;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .footer a {
            color: #1e4d2b;
            text-decoration: none;
            font-weight: bold;
        }

        .imprint {
            margin-top: 15px;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PACO Y PACO</h1>
        <div class="line"></div>
        <div class="keywords">FOLK. FEUER. KARACHO.</div>
        <div class="coming-soon">SOMETHING BIG IS COMING SOON.</div>
    </div>

    <div class="footer">
        <a href="mailto:hello@pacopacopaco.wtf">hello@pacopacopaco.wtf</a>
        <div class="imprint">
            <strong>Impressum:</strong><br>
            Brian Junker-Latocha<br>
            Herm.-Steinhäuser-Str. 18<br>
            63065 Offenbach am Main
        </div>
    </div>

</body>
</html>
