<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACO Y PACO | Coming Soon</title>
    <style>
        /* Grunddesign & Farben basierend auf dem Poster */
        body {
            margin: 0;
            padding: 0;
            background-color: #f2e9d9; /* Vintage Beige vom Poster */
            color: #1a1a1a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            padding: 20px;
        }

        /* Überschrift im kräftigen Rot */
        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            margin: 0;
            color: #b22222;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Die Trennlinie */
        .line {
            width: 100px;
            height: 4px;
            background-color: #1a1a1a;
            margin: 20px auto;
        }

        /* Die drei Stichworte in Grün */
        .keywords {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            color: #1e4d2b;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* "Something big is coming soon" */
        .coming-soon {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #333;
            letter-spacing: 2px;
            font-weight: 300;
            font-style: italic;
            animation: pulse 2s infinite ease-in-out;
        }

        /* E-Mail Link im Fußbereich */
        .footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
        }

        .footer a {
            color: #1e4d2b;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 2px solid transparent;
            transition: border 0.3s;
        }

        .footer a:hover {
            border-bottom: 2px solid #1e4d2b;
        }

        /* Animation für den Coming Soon Text */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PACO Y PACO</h1>
        <div class="line"></div>
        <div class="keywords">FOLK. FEUER. KARACHO.</div>
        <div class="coming-soon">SOMETHING BIG IS COMING SOON.</div>
    </div>

    <div class="footer">
        <a href="mailto:hello@pacopacopaco.wtf">hello@pacopacopaco.wtf</a>
    </div>

</body>
</html>
